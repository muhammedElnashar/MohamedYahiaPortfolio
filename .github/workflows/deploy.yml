name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger

          for i in 1 2 3; do
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts && break
            echo "Retry ssh-keyscan ($i)..."
            sleep 3
          done

      - name: Deploy files to Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |

          for i in 1 2 3; do

            rsync -az \
              --delay-updates \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.env' \
              --exclude='node_modules/' \
              --exclude='vendor/' \
              --exclude='storage/' \
              -e "ssh -i ~/.ssh/hostinger -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15" \
              ./ "$SSH_USER@$SSH_HOST:/home/u684683991/domains/mohamedyahiaseo.com/public_html/" && break

            echo "Retry rsync ($i)..."
            sleep 5

          done

      - name: Run Laravel deployment commands
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |

          ssh \
            -i ~/.ssh/hostinger \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" << 'EOF'

          set -e

          cd /home/u684683991/domains/mohamedyahiaseo.com/public_html

          until [ -f composer.json ]; do
            echo "Waiting for composer.json..."
            sleep 2
          done

          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

          php artisan migrate --force

          php artisan storage:link || true

          chmod -R 775 storage bootstrap/cache || true

          php artisan optimize:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan queue:restart || true

          EOF
